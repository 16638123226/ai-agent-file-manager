services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - HF_ENDPOINT=https://hf-mirror.com
    depends_on:
      - chroma
    volumes:
      - ./memory.json:/app/memory.json
      - ./chroma_db:/app/chroma_db

  chroma:
    image: chromadb/chroma
    ports:
      - "8001:8001"
    volumes:
      - ./chroma_data:/chroma/chroma